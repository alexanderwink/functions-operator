---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: functions.functions.pulsen.se
spec:
  group: functions.pulsen.se
  names:
    kind: Function
    listKind: FunctionList
    plural: functions
    shortNames:
    - fn
    singular: function
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.source.version
      name: Version
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Function is the Schema for the functions API

          The name becomes a Service name (DNS-1035: must start with a letter) and,
          for services, <name>-backend (<= 63 characters); a job's CronJob name must
          leave room for the Job suffix (<= 52 characters).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Function
            properties:
              architectures:
                default:
                - amd64
                description: architectures to run on.
                items:
                  enum:
                  - amd64
                  - arm64
                  type: string
                minItems: 1
                type: array
              concurrency:
                default: 1
                description: concurrency is the number of bootstrap copies per pod.
                format: int32
                maximum: 64
                minimum: 1
                type: integer
              env:
                description: |-
                  env is the environment passed to the function. Names starting with
                  FUNCRT_ or AWS_LAMBDA_, and LAMBDA_TASK_ROOT and _HANDLER, are reserved.
                items:
                  description: EnvVar represents an environment variable present in
                    a Container.
                  properties:
                    name:
                      description: |-
                        Name of the environment variable.
                        May consist of any printable ASCII characters except '='.
                      type: string
                    value:
                      description: |-
                        Variable references $(VAR_NAME) are expanded
                        using the previously defined environment variables in the container and
                        any service environment variables. If a variable cannot be resolved,
                        the reference in the input string will be unchanged. Double $$ are reduced
                        to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                        "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                        Escaped references will never be expanded, regardless of whether the variable
                        exists or not.
                        Defaults to "".
                      type: string
                    valueFrom:
                      description: Source for the environment variable's value. Cannot
                        be used if value is not empty.
                      properties:
                        configMapKeyRef:
                          description: Selects a key of a ConfigMap.
                          properties:
                            key:
                              description: |-
                                The key to select from the ConfigMap's Data field.
                                Keys in the BinaryData field are not currently propagated to container env vars.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key
                                must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        fieldRef:
                          description: |-
                            Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                            spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                          properties:
                            apiVersion:
                              description: Version of the schema the FieldPath is
                                written in terms of, defaults to "v1".
                              type: string
                            fieldPath:
                              description: Path of the field to select in the specified
                                API version.
                              type: string
                          required:
                          - fieldPath
                          type: object
                          x-kubernetes-map-type: atomic
                        fileKeyRef:
                          description: |-
                            FileKeyRef selects a key of the env file.
                            Requires the EnvFiles feature gate to be enabled.
                          properties:
                            key:
                              description: |-
                                The key within the env file. An invalid key will prevent the pod from starting.
                                The keys defined within a source may consist of any printable ASCII characters except '='.
                                During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                              type: string
                            optional:
                              default: false
                              description: |-
                                Specify whether the file or its key must be defined. If the file or key
                                does not exist, then the env var is not published.
                                If optional is set to true and the specified key does not exist,
                                the environment variable will not be set in the Pod's containers.

                                If optional is set to false and the specified key does not exist,
                                an error will be returned during Pod creation.
                              type: boolean
                            path:
                              description: |-
                                The path within the volume from which to select the file.
                                Must be relative and may not contain the '..' path or start with '..'.
                              type: string
                            volumeName:
                              description: The name of the volume mount containing
                                the env file.
                              type: string
                          required:
                          - key
                          - path
                          - volumeName
                          type: object
                          x-kubernetes-map-type: atomic
                        resourceFieldRef:
                          description: |-
                            Selects a resource of the container: only resources limits and requests
                            (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                          properties:
                            containerName:
                              description: 'Container name: required for volumes,
                                optional for env vars'
                              type: string
                            divisor:
                              anyOf:
                              - type: integer
                              - type: string
                              description: Specifies the output format of the exposed
                                resources, defaults to "1"
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            resource:
                              description: 'Required: resource to select'
                              type: string
                          required:
                          - resource
                          type: object
                          x-kubernetes-map-type: atomic
                        secretKeyRef:
                          description: Selects a key of a secret in the pod's namespace
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                maxItems: 256
                type: array
                x-kubernetes-validations:
                - message: env name is reserved by the platform (FUNCRT_*, AWS_LAMBDA_*,
                    LAMBDA_TASK_ROOT, _HANDLER)
                  rule: self.all(e, !e.name.startsWith('FUNCRT_') && !e.name.startsWith('AWS_LAMBDA_')
                    && e.name != 'LAMBDA_TASK_ROOT' && e.name != '_HANDLER')
              memory:
                anyOf:
                - type: integer
                - type: string
                default: 128Mi
                description: memory per bootstrap copy.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
                x-kubernetes-validations:
                - message: memory must be greater than 0
                  rule: quantity(string(self)).isGreaterThan(quantity('0'))
              payload:
                description: payload is the event passed to a job instead of the default
                  scheduled event.
                x-kubernetes-preserve-unknown-fields: true
              scaling:
                description: scaling bounds replicas (services only).
                properties:
                  max:
                    default: 10
                    description: max is the maximum number of replicas.
                    format: int32
                    minimum: 1
                    type: integer
                  min:
                    default: 0
                    description: min is the minimum number of replicas (0 allows scale
                      to zero).
                    format: int32
                    minimum: 0
                    type: integer
                  scaledownPeriodSeconds:
                    default: 300
                    description: |-
                      scaledownPeriodSeconds is how long a service stays scaled up after its
                      last request before scaling down (to min).
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              schedule:
                description: schedule is a cron expression (jobs only).
                type: string
              source:
                description: source locates the bootstrap binaries in S3.
                properties:
                  bucket:
                    description: bucket is the S3 bucket holding the function.
                    minLength: 1
                    type: string
                  key:
                    description: key is a single S3 path segment. Defaults to metadata.name
                      when empty.
                    maxLength: 128
                    minLength: 1
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                    type: string
                  version:
                    description: 'version is a single path segment: a fixed version
                      string, or "latest".'
                    maxLength: 128
                    minLength: 1
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                    type: string
                required:
                - bucket
                - version
                type: object
              timeout:
                default: 30s
                description: timeout per invocation.
                type: string
                x-kubernetes-validations:
                - message: timeout must be greater than 0
                  rule: duration(self) > duration('0s')
              type:
                description: type is "service" (HTTP) or "job" (cron).
                enum:
                - service
                - job
                type: string
            required:
            - source
            - type
            type: object
            x-kubernetes-validations:
            - message: schedule is required for jobs and forbidden for services
              rule: 'self.type == ''job'' ? has(self.schedule) : !has(self.schedule)'
            - message: scaling is only allowed for services
              rule: self.type == 'service' || !has(self.scaling)
            - message: concurrency must be 1 for jobs
              rule: self.type == 'service' || !has(self.concurrency) || self.concurrency
                == 1
            - message: scaling.min must be <= scaling.max
              rule: '!has(self.scaling) || self.scaling.min <= self.scaling.max'
          status:
            description: status defines the observed state of Function
            properties:
              conditions:
                description: conditions represent the current state of the Function
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              etags:
                additionalProperties:
                  type: string
                description: etags maps architecture to the S3 ETag of the resolved
                  bootstrap.
                type: object
              observedGeneration:
                description: observedGeneration is the last reconciled metadata.generation.
                format: int64
                type: integer
              resolvedVersion:
                description: resolvedVersion is the concrete version currently deployed.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: metadata.name must start with a letter and contain only lowercase
            letters, digits and '-' (DNS-1035)
          rule: self.metadata.name.matches('^[a-z]([-a-z0-9]*[a-z0-9])?$')
        - message: metadata.name must be at most 55 characters for services (<name>-backend
            <= 63) and 52 for jobs
          rule: 'self.spec.type == ''job'' ? self.metadata.name.size() <= 52 : self.metadata.name.size()
            <= 55'
    served: true
    storage: true
    subresources:
      status: {}
